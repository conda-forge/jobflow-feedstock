schema_version: 1

context:
  name: jobflow
  version: 0.3.1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/jobflow-${{ version }}.tar.gz
  sha256: fbfa3c84598e7d69d489c93c95e2c85b4908497131451636fb8369aaaf180b0c
  patches:
    - version.patch

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools-scm
    - setuptools
  run:
    - maggma >=0.72.0
    - monty >=2021.5.9
    - networkx
    - pydantic
    - pydash
    - python >=${{ python_min }}
    - pyyaml
    - setuptools

tests:
  - python:
      imports:
        - jobflow
        - jobflow.core
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip list | grep jobflow

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: jobflow is a library for writing computational workflows.
  description: |
    Jobflow is a free, open-source library for writing and executing
    workflows. Complex workflows can be defined using simple python
    functions and executed locally or on arbitrary computing resources
    using the FireWorks workflow manager.
  homepage: https://materialsproject.github.io/jobflow
  repository: https://github.com/materialsproject/jobflow
  documentation: https://materialsproject.github.io/jobflow

extra:
  recipe-maintainers:
    - jan-janssen
